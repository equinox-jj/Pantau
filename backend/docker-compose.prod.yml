# Production stack. Postgres and the MinIO console are not published;
# only the API and the MinIO object port (public image URLs) are.
# Set MINIO_PUBLIC_URL in .env to the public host serving port 9000.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
name: pantau-prod

services:
  pantau-db:
    image: postgis/postgis:18-3.6-alpine
    # Official PostGIS images are amd64-only; emulated on Apple Silicon.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@pantau-db:5432/${DB_NAME}?sslmode=disable
      - up
    depends_on:
      pantau-db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_PORT: 8080
      GORM_SHOW_SQL: "false"
      DB_HOST: pantau-db
      DB_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      # The api talks to MinIO inside the compose network over plain HTTP;
      # put TLS on MINIO_PUBLIC_URL instead.
      MINIO_USE_SSL: "false"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
